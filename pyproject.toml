[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lexicon"
version = "0.1.0"
description = "AI-powered legal document analysis and research system"
authors = ["aayushmaan123 <your_email@example.com>"]
readme = "README.md"
packages = [{include = "lexicon"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
typer = "^0.9.0"
openai = "^1.10.0"
anthropic = "^0.18.0"
chromadb = "^0.4.22"
psycopg = {extras = ["binary"], version = "^3.1.18"}
sqlalchemy = "^2.0.25"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
pymupdf = "^1.23.0"
python-docx = "^1.1.0"
python-multipart = "^0.0.9"
tiktoken = "^0.6.0"
httpx = "^0.26.0"
rich = "^13.7.0"
sentence-transformers = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.2.0"

[tool.poetry.scripts]
lexicon = "lexicon.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lexicon --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["lexicon"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]